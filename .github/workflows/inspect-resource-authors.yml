name: Inspect resource authors
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-resource-authors.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Inspect presentation and resource PDF title pages
        run: |
          set -e
          target="documents/pdf-library/8a054d-9c0f0d22003e4b859fa38f15a7413073-989da9ec.pdf"
          echo "===== TARGET PDF FIRST 5 PAGES ====="
          pdftotext -f 1 -l 5 -layout "$target" - | sed -n '1,220p'
          echo "===== WILSON/HANEEF MATCHES ACROSS PDF LIBRARY ====="
          find documents/pdf-library -type f -name '*.pdf' -print0 | while IFS= read -r -d '' f; do
            txt=$(pdftotext -f 1 -l 6 -layout "$f" - 2>/dev/null || true)
            if printf '%s' "$txt" | grep -Eiq 'Haneef|Wilson'; then
              echo "--- $f ---"
              printf '%s\n' "$txt" | grep -Ein -C 4 'Haneef|Wilson' | head -80
            fi
          done
