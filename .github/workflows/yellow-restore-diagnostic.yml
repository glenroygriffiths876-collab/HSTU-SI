name: Yellow restore diagnostic
on:
  push:
    paths:
      - '.github/workflows/yellow-restore-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect pre-theme yellow styling
        run: |
          python - <<'PY'
          import subprocess,re
          old=subprocess.check_output(["git","show","aab5195b0f83366be975c35c2854548f650e100e:index.html"],text=True,errors="ignore")
          selectors=[".topline",".proposal-banner",".hst-gallery-cta",".hst-gallery-cta-icon",".hstu-pwa-btn",".hstu-install-primary"]
          for sel in selectors:
              print("\n===== "+sel+" =====")
              for m in re.finditer(re.escape(sel),old):
                  a=max(0,m.start()-800); b=min(len(old),m.start()+2200)
                  block=old[a:b].replace("data:image/","DATA_IMAGE/")
                  print(block)
          print("\n===== YELLOW/GOLD COLOR CANDIDATES =====")
          colors=re.findall(r'#[0-9a-fA-F]{3,8}|rgba?\([^\)]*\)|hsla?\([^\)]*\)',old)
          from collections import Counter
          c=Counter(x.lower() for x in colors)
          for color,n in c.most_common():
              # Rough yellow/gold detection for hex/rgb.
              hit=False
              if color.startswith("#"):
                  h=color[1:]
                  if len(h) in (3,4): h=''.join(ch*2 for ch in h[:3])
                  if len(h)>=6:
                      try:
                          r,g,b=int(h[:2],16),int(h[2:4],16),int(h[4:6],16)
                          hit=(r>150 and g>110 and b<130 and abs(r-g)<140)
                      except: pass
              elif color.startswith("rgb"):
                  nums=[int(x) for x in re.findall(r'\d+',color)[:3]]
                  if len(nums)==3:
                      r,g,b=nums; hit=(r>150 and g>110 and b<130)
              if hit: print(n,color)
          PY
