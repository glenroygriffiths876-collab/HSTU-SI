name: Apply 9.30 refinements
on:
  push:
    paths:
      - 'final-refinements-930.js'
      - '.github/workflows/apply-930-refinements.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inject refinement layer and refresh PWA cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          # Replace the existing inline runtime IN PLACE; never append
          # stray newlines or alter the service worker for visual edits.
          s=re.sub(r'<script[^>]+src=["\']final-refinements-930\.js[^"\']*["\'][^>]*></script>','',s,flags=re.I)
          js=Path("final-refinements-930.js").read_text(encoding="utf-8")
          tag='<script id="hstu-final-refinements-930">\n'+js+'\n</script>'
          pattern=r'<script id=["\']hstu-final-refinements-930["\']>.*?</script>'
          s,count=re.subn(pattern,lambda _:tag,s,flags=re.I|re.S)
          if count>1: raise SystemExit("Duplicate refinement runtimes: "+str(count))
          if count==0:
            idx=s.lower().rfind('</body>')
            if idx<0: raise SystemExit("No </body>")
            s=s[:idx]+tag+'\n'+s[idx:]
          if s!=p.read_text(encoding="utf-8"):
            p.write_text(s,encoding="utf-8")
          # NEVER rewrite service-worker.js in this styling/refinement workflow.
          # Cache releases require a separate tested reliability change.
          PY
      - name: Static QA
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          j=Path("final-refinements-930.js").read_text(encoding="utf-8")
          assert s.count('id="hstu-final-refinements-930"')==1
          import re
          m=re.search(r'<script id="hstu-final-refinements-930">\s*(.*?)\s*</script>',s,re.S)
          assert m and m.group(1).strip()==j.strip(), "Inline runtime differs from source file"
          assert "button[data-purpose-view=" in j, "Missing approved homepage button theme"
          assert ".hstu-purpose-cta-930 button:focus-visible" in j
          assert len(list(Path("media/repository").glob("*.webp")))==51
          for phrase in [
            "15 Thematic Research Areas","Research Agenda Priorities","Presentations","Posters",
            "External Links","Learning","Find Services","Explore Research","PrEP",
            "approximately 200 studies","volume 2 of Unveiling Hope","hstu-animated-title-930"
          ]:
            assert phrase in j, phrase
          assert "Swipe tabs" not in j
          assert "hstuMobileMenu930" in j
          print("STATIC QA PASS")
          PY
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser QA desktop and mobile
        run: |
          python -m http.server 8000 >/tmp/hstu-server.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1 && break; sleep 0.25; done
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const ok=(v,m)=>{if(!v) throw new Error(m);};
          const expected={All:51,HIV:21,STI:5,TB:1,PrEP:2};
          async function visibleGalleryCount(page){return page.locator('#hstuGalleryGrid > *:visible').count();}
          async function activate(page,view){await page.evaluate(v=>{if(typeof window.setView==='function') window.setView(v);},view); await page.waitForTimeout(180);}

          async function core(viewport,name){
            const page=await browser.newPage({viewport});
            const errors=[];
            page.on('pageerror',e=>errors.push('page:'+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text());});
            await page.goto('http://127.0.0.1:8000/#home',{waitUntil:'networkidle'});
            await page.waitForTimeout(1200);

            ok(await page.locator('html').getAttribute('data-hstu-refinements930')==='ready',name+': runtime');
            const dims=await page.evaluate(()=>({doc:document.documentElement.scrollWidth,body:document.body.scrollWidth,win:innerWidth}));
            ok(dims.doc<=dims.win+3 && dims.body<=dims.win+3,name+': overflow '+JSON.stringify(dims));

            const hero=page.locator('#home-purpose-hero');
            const ht=await hero.innerText();
            ok(ht.includes('About the Research Data Repository'),name+': hero title');
            ok(ht.includes('approximately 200 studies'),name+': full About paragraph 3');
            ok(ht.includes('volume 2 of Unveiling Hope'),name+': full About paragraph 4');
            ok(ht.includes('emerging trends'),name+': About ending');
            ok(await page.locator('#home-purpose-summary').count()===0,name+': summary block removed');
            ok(await page.locator('#repository-purpose').isVisible()===false,name+': legacy About hidden');
            ok(await page.locator('#home-thematic-areas .hstu-theme-card').count()===15,name+': themes');
            ok(await page.locator('#home-quick-access').count()===1,name+': one Quick Access section');
            ok(await page.locator('#home-quick-access .hstu-quick-card').count()===7,name+': seven Quick Access cards');
            const quickHeadCount=await page.locator('#view-home').getByText('Everything important, easier to reach.',{exact:true}).count();
            ok(quickHeadCount===1,name+': Quick Access heading duplicated '+quickHeadCount);
            const anim=await page.locator('.hstu-animated-title-930').evaluate(el=>getComputedStyle(el).animationName);
            ok(anim && anim!=='none',name+': title animation missing');
            // Approved HSTU brand palette; check computed colours on each device.
            const cta=page.locator('#home-purpose-hero .hstu-purpose-cta-930 button');
            ok(await cta.count()===3,name+': exactly three hero actions');
            const expectedButtons=[
              ['research','rgb(22, 148, 71)','rgb(255, 255, 255)'],
              ['reports','rgb(215, 25, 32)','rgb(255, 255, 255)'],
              ['data-audit','rgb(242, 183, 20)','rgb(22, 19, 7)']
            ];
            for(const [route,bg,fg] of expectedButtons){
              const button=page.locator('#home-purpose-hero .hstu-purpose-cta-930 button[data-purpose-view="'+route+'"]');
              ok(await button.count()===1,name+': '+route+' button missing');
              const style=await button.evaluate(el=>{
                const cs=getComputedStyle(el);
                return {background:cs.backgroundColor,color:cs.color,backgroundImage:cs.backgroundImage};
              });
              ok(style.background===bg && style.color===fg && style.backgroundImage==='none',
                name+': '+route+' colour regression '+JSON.stringify(style));
            }
            for(const [route] of expectedButtons){
              await page.locator('#home-purpose-hero .hstu-purpose-cta-930 button[data-purpose-view="'+route+'"]').click();
              await page.waitForTimeout(120);
              ok(await page.locator('#view-'+route+'.active').count()===1,name+': '+route+' first-tap navigation');
              await activate(page,'home');
            }

            if(name==='desktop'){
              const service=await page.locator('.nav-btn[data-view="services"]').boundingBox();
              ok(service && service.x+service.width<=viewport.width+2,name+': Find Services off screen');
              const home=page.locator('.nav-btn[data-view="home"]').first();
              await home.hover();
              const dd=home.locator('xpath=..').locator('.hstu-nav-dropdown');
              ok(await dd.isVisible(),name+': Home dropdown');
              const dir=await dd.evaluate(el=>getComputedStyle(el).flexDirection);
              ok(dir==='column',name+': dropdown not vertical '+dir);
              await page.screenshot({path:'/tmp/desktop-home.png',fullPage:false});
            }else{
              ok(await page.getByText('Swipe tabs →',{exact:true}).count()===0,name+': Swipe tabs remains');
              const toggle=page.locator('#menuToggle');
              const mobileMenu=page.locator('#hstuMobileMenu930');
              ok(await toggle.isVisible(),name+': hamburger hidden');
              ok(await page.locator('#mainNav').isVisible()===false,name+': desktop nav visible on mobile');
              ok(await mobileMenu.count()===1,name+': dedicated mobile menu missing');
              ok(await mobileMenu.isVisible()===false,name+': mobile menu must start closed');
              ok(await page.locator('#hstuMobileSubnav930').count()===0,name+': detached mobile subnav remains');
              await toggle.click();
              await page.waitForTimeout(120);
              ok(await mobileMenu.isVisible(),name+': menu did not open');
              const dir=await mobileMenu.evaluate(el=>getComputedStyle(el).flexDirection);
              ok(dir==='column',name+': mobile menu not vertical '+dir);
              const gallery=mobileMenu.locator('.hstu-mobile-parent-930').filter({hasText:/^Gallery$/});
              await gallery.click();
              await page.waitForTimeout(100);
              const group=gallery.locator('xpath=..');
              const gdd=group.locator('.hstu-mobile-children-930');
              ok(await gdd.isVisible(),name+': Gallery accordion did not expand');
              const labels=(await gdd.locator('button').allTextContents()).map(x=>x.trim());
              ok(JSON.stringify(labels)===JSON.stringify(['All','HIV','STI','TB','PrEP']),name+': Gallery accordion labels '+JSON.stringify(labels));
              await page.screenshot({path:'/tmp/mobile-menu.png',fullPage:false});
              await gdd.locator('button').filter({hasText:/^TB$/}).click();
              await page.waitForTimeout(650);
              ok(await page.locator('#view-gallery.active').count()===1,name+': TB did not open Gallery');
              ok(await visibleGalleryCount(page)===1,name+': TB filter from accordion');
              ok(await mobileMenu.isVisible()===false,name+': menu did not close after selection');
              await page.screenshot({path:'/tmp/mobile-gallery.png',fullPage:false});
            }

            await activate(page,'gallery');
            const filterLabels=(await page.locator('#hstuGalleryFilters button').allTextContents()).map(x=>x.trim());
            ok(JSON.stringify(filterLabels)===JSON.stringify(['All','HIV','STI','TB','PrEP']),name+': Gallery filters');
            for(const key of ['All','HIV','STI','TB','PrEP']){
              await page.locator('#hstuGalleryFilters button').filter({hasText:new RegExp('^'+key+'$')}).click();
              await page.waitForTimeout(80);
              ok(await visibleGalleryCount(page)===expected[key],name+': Gallery '+key);
            }

            await activate(page,'home');
            for(const idx of [0,6,9,13,14]){
              await page.locator('#home-thematic-areas .hstu-theme-card').nth(idx).click();
              await page.waitForTimeout(320);
              ok(await page.locator('#view-research.active').count()===1,name+': thematic '+(idx+1));
              const selected=await page.locator('#refineResearchObjective').inputValue();
              ok(selected!==''&&!/all/i.test(selected),name+': objective '+(idx+1));
              await activate(page,'home');
            }
            ok(errors.length===0,name+': errors '+errors.join(' | '));
            if(name==='mobile') await page.screenshot({path:'/tmp/mobile-home.png',fullPage:false});
            await page.close();
          }

          await core({width:1440,height:900},'desktop');
          await core({width:390,height:844},'mobile');

          for(const [w,h] of [[412,915],[768,1024],[1024,768],[1280,800],[1366,768],[1536,864],[1920,1080]]){
            const page=await browser.newPage({viewport:{width:w,height:h}});
            await page.goto('http://127.0.0.1:8000/#home',{waitUntil:'networkidle'});
            await page.waitForTimeout(700);
            const d=await page.evaluate(()=>({doc:document.documentElement.scrollWidth,body:document.body.scrollWidth,win:innerWidth}));
            ok(d.doc<=d.win+3 && d.body<=d.win+3,'responsive overflow '+w+' '+JSON.stringify(d));
            await page.close();
          }
          await browser.close();
          console.log('BROWSER QA PASS');
          JS
          node qa.mjs
      - name: Link QA
        run: |
          cat > links.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
          await page.waitForTimeout(900);
          await page.evaluate(()=>{if(typeof window.setView==='function') window.setView('resources');});
          await page.waitForTimeout(200);
          const links=await page.locator('#resources-learning a[href],#resources-external a[href]').evaluateAll(as=>[...new Set(as.map(a=>a.href).filter(h=>/^https?:/i.test(h)))]);
          let bad=[];
          for(const url of links){
            try{
              const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(15000),headers:{'user-agent':'Mozilla/5.0'}});
              if(r.status===404||r.status===410) bad.push([r.status,url]);
            }catch(e){}
          }
          if(bad.length) throw new Error('Dead 404/410 links: '+JSON.stringify(bad));
          console.log('LINK QA PASS:',links.length);
          await browser.close();
          JS
          node links.mjs
      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: hstu-home-mobile-nav-qa
          path: |
            /tmp/desktop-home.png
            /tmp/mobile-home.png
            /tmp/mobile-menu.png
            /tmp/mobile-gallery.png
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No production patch changes"
          else
            git commit -m "Apply refined Home and mobile navigation"
            git pull --rebase origin main
            git push origin main
          fi
