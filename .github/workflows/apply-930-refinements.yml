name: Apply 9.30 refinements
on:
  push:
    paths:
      - 'final-refinements-930.js'
      - '.github/workflows/apply-930-refinements.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inject refinement layer and refresh PWA cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r'<script[^>]+src=["\']final-refinements-930\.js[^"\']*["\'][^>]*></script>','',s,flags=re.I)
          s=re.sub(r'<script id=["\']hstu-final-refinements-930["\']>.*?</script>','',s,flags=re.I|re.S)
          js=Path("final-refinements-930.js").read_text(encoding="utf-8")
          tag='<script id="hstu-final-refinements-930">\n'+js+'\n</script>'
          idx=s.lower().rfind('</body>')
          if idx<0: raise SystemExit("No </body>")
          s=s[:idx]+tag+'\n'+s[idx:]
          p.write_text(s,encoding="utf-8")
          sw=Path("service-worker.js")
          w=sw.read_text(encoding="utf-8")
          w=re.sub(r'hstu-resource-centre-v[^"\']+','hstu-resource-centre-v20261001-home-nav-gallery-v2',w,count=1)
          sw.write_text(w,encoding="utf-8")
          PY
      - name: Static QA
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          j=Path("final-refinements-930.js").read_text(encoding="utf-8")
          assert s.count('id="hstu-final-refinements-930"')==1
          assert len(list(Path("media/repository").glob("*.webp")))==51
          for phrase in [
            "15 Thematic Research Areas","Research Agenda Priorities","Presentations","Posters",
            "External Links","Learning","Find Services","Explore Research","PrEP"
          ]:
            assert phrase in j, phrase
          assert "C-Tech" not in j
          print("STATIC QA PASS: 51 repository images; refinement layer injected once")
          PY
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install chromium
      - name: Browser QA desktop and mobile
        run: |
          python -m http.server 8000 >/tmp/hstu-server.log 2>&1 &
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg);};
          async function visibleGalleryCount(page){
            return await page.locator('#hstuGalleryGrid > *:visible').count();
          }
          async function go(page,view){
            const top=page.locator('.nav-btn[data-view="'+view+'"]').first();
            await top.click();
            await page.waitForTimeout(180);
          }
          async function run(viewport,name){
            const page=await browser.newPage({viewport});
            const errors=[];
            page.on('pageerror',e=>errors.push('page:'+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text());});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await page.waitForTimeout(1100);

            assert(await page.locator('html').getAttribute('data-hstu-refinements930')==='ready',name+': refinement runtime');
            const nav=(await page.locator('.nav-btn[data-view]').allTextContents()).map(x=>x.trim());
            for(const x of ['Home','Research','Capacity Building','Reports','Data Audit and Utilization','Gallery','Resources','Find Services']) assert(nav.includes(x),name+': nav '+x);

            const dims=await page.evaluate(()=>({doc:document.documentElement.scrollWidth,win:window.innerWidth,body:document.body.scrollWidth}));
            assert(dims.doc<=dims.win+3 && dims.body<=dims.win+3,name+': no horizontal body overflow '+JSON.stringify(dims));

            const hero=page.locator('#home-purpose-hero');
            assert(await hero.count()===1,name+': integrated Home hero exists');
            assert((await hero.innerText()).includes('About the Research Data Repository'),name+': About title in hero');
            assert((await hero.innerText()).includes('conceptualized in 2023'),name+': repository origin in hero');
            assert((await hero.innerText()).includes('Jamaica and the wider Caribbean'),name+': Caribbean scope in hero');
            assert(await page.locator('#repository-purpose').isVisible()===false,name+': duplicate About section hidden');
            assert(await page.locator('#home-purpose-summary .hstu-purpose-highlights-930 > *').count()===4,name+': four Home summary facts');
            assert(await page.locator('#home-thematic-areas .hstu-theme-card').count()===15,name+': 15 thematic areas');
            assert(await page.locator('#home-quick-access .hstu-quick-card').count()===7,name+': Quick Access cards');
            assert(await page.locator('#view-home').getByText(/Explore Research/).count()>=1,name+': Explore Research present');
            assert(await page.locator('#view-home').getByText(/Explore Capacity Building/).count()===0,name+': second Explore removed');

            if(name==='mobile'){
              assert(await page.locator('#mainNav').isVisible(),name+': slider navigation visible');
              const navScroller=page.locator('.hstu-primary-nav-scroll').first();
              assert(await navScroller.count()===1,name+': mobile slider class');
              const ov=await navScroller.evaluate(el=>({sw:el.scrollWidth,cw:el.clientWidth,overflow:getComputedStyle(el).overflowX,dir:getComputedStyle(el).flexDirection}));
              assert((ov.overflow==='auto'||ov.overflow==='scroll') && ov.dir==='row',name+': horizontal nav configured '+JSON.stringify(ov));
              assert(await page.locator('#mainNav .hstu-nav-dropdown:visible').count()===0,name+': no submenu open on initial load');
              assert(await page.locator('.nav-btn[data-view="services"]').isVisible(),name+': Find Services visible/reachable');
            } else {
              assert(await page.locator('.nav-btn[data-view="services"]').isVisible(),name+': desktop Find Services visible');
              const servicesBox=await page.locator('.nav-btn[data-view="services"]').boundingBox();
              assert(servicesBox && servicesBox.x+servicesBox.width<=viewport.width+2,name+': desktop Find Services inside viewport');
            }

            await go(page,'gallery');
            const labels=(await page.locator('#hstuGalleryFilters button').allTextContents()).map(x=>x.trim());
            assert(JSON.stringify(labels)===JSON.stringify(['All','HIV','STI','TB','PrEP']),name+': Gallery filters exact');

            const expected={All:51,HIV:21,STI:5,TB:1,PrEP:2};
            for(const key of ['All','HIV','STI','TB','PrEP']){
              await page.locator('#hstuGalleryFilters button').filter({hasText:new RegExp('^'+key+'$')}).click();
              await page.waitForTimeout(80);
              const n=await visibleGalleryCount(page);
              assert(n===expected[key],name+': Gallery '+key+' count '+n+' expected '+expected[key]);
              assert(await page.locator('#hstuGalleryFilters button.active').filter({hasText:new RegExp('^'+key+'$')}).count()===1,name+': Gallery '+key+' active');
            }

            const tbDrop=page.locator('.nav-btn[data-view="gallery"]').locator('xpath=..').locator('.hstu-nav-dropdown button').filter({hasText:/^TB$/});
            assert(await tbDrop.count()===1,name+': Gallery TB dropdown exists');
            await tbDrop.click({force:true});
            await page.waitForTimeout(220);
            assert(await visibleGalleryCount(page)===1,name+': Gallery dropdown applies TB filter');

            await go(page,'home');
            for(const idx of [0,6,9,13,14]){
              await page.locator('#home-thematic-areas .hstu-theme-card').nth(idx).click();
              await page.waitForTimeout(320);
              assert(await page.locator('#view-research.active').count()===1,name+': thematic '+(idx+1)+' opens Research');
              const selected=await page.locator('#refineResearchObjective').inputValue();
              assert(selected!=='' && !/all/i.test(selected),name+': thematic '+(idx+1)+' applies objective');
              await go(page,'home');
            }

            assert(errors.length===0,name+': browser errors '+errors.join(' | '));
            await page.screenshot({path:'/tmp/'+name+'.png',fullPage:true});
            await page.close();
          }
          await run({width:1440,height:1000},'desktop');
          await run({width:390,height:844},'mobile');
          console.log('BROWSER QA PASS');
          await browser.close();
          JS
          node qa.mjs
      - name: Link QA
        run: |
          cat > links.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
          await page.waitForTimeout(900);
          await page.locator('.nav-btn[data-view="resources"]').click();
          await page.waitForTimeout(200);
          const links=await page.locator('#resources-learning a[href],#resources-external a[href]').evaluateAll(as=>[...new Set(as.map(a=>a.href).filter(h=>/^https?:/i.test(h)))]);
          let bad=[];
          for(const url of links){
            try{
              const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(15000),headers:{'user-agent':'Mozilla/5.0'}});
              console.log(r.status,url);
              if(r.status===404||r.status===410) bad.push([r.status,url]);
            }catch(e){console.log('UNVERIFIED',url,e.name);}
          }
          if(bad.length) throw new Error('Dead 404/410 links: '+JSON.stringify(bad));
          console.log('LINK QA PASS:',links.length,'resource links checked; no 404/410');
          await browser.close();
          JS
          node links.mjs
      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: hstu-930-refinements-qa
          path: |
            /tmp/desktop.png
            /tmp/mobile.png
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then
            echo "No production patch changes"
          else
            git commit -m "Apply Shanille 9.30 repository refinements"
            git pull --rebase origin main
            git push origin main
          fi
