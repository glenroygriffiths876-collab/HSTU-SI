name: Snapshot source repository site
on:
  push:
    paths:
      - '.github/workflows/snapshot-source-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: python scripts/snapshot_jmerg_site.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal-audits/source-site-snapshot
          if ! git diff --cached --quiet; then
            git commit -m "Capture complete public source-site inventory for HSTU content parity"
            git push
          fi
