name: Live PDF delivery integrity

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'pdf-library.json'
      - '.github/workflows/live-pdf-delivery-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hstu-live-pdf-delivery
  cancel-in-progress: true

jobs:
  pdf-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Audit published PDFs, previews and manual links
        id: pdfcheck
        run: |
          cat > pdf-delivery.mjs <<'JS'
          import {chromium} from 'playwright';
          import {readFileSync} from 'node:fs';
          const BASE='https://glenroygriffiths876-collab.github.io/HSTU-SI/';
          const must=(c,m)=>{if(!c)throw Error(m)};
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({headless:true});
          async function reachable(url){
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const response=await fetch(url,{method:'HEAD',signal:AbortSignal.timeout(20000),
                  headers:{'Cache-Control':'no-cache'}});
                if(response.ok) return {ok:true,type:response.headers.get('content-type')||''};
                if(attempt===3)return{ok:false,status:response.status};
              }catch(e){if(attempt===3)return{ok:false,error:String(e)}}
              await wait(1200);
            }
          }
          async function allConcurrent(arr,fn,max=8){
            const results=new Array(arr.length);
            let cursor=0;
            await Promise.all(Array.from({length:Math.min(max,arr.length)},async()=>{
              while(cursor<arr.length){
                const n=cursor++;
                results[n]=await fn(arr[n],n);
              }
            }));
            return results;
          }
          try{
            const expectedSW=readFileSync('service-worker.js','utf8');
            must(expectedSW.includes('if(event.request.mode==="navigate" && !isAppEntry) return;'),
              'Source service-worker is not protecting document navigation');
            const marker='function manualSourceUrl(m)';
            let deployed=false;
            for(let k=0;k<40;k++){
              const [h,w]=await Promise.all([
                fetch(BASE+'?pdf_delivery='+Date.now(),{cache:'no-store'}).then(r=>r.text()).catch(()=>''),
                fetch(BASE+'service-worker.js?pdf_delivery='+Date.now(),{cache:'no-store'}).then(r=>r.text()).catch(()=>'')
              ]);
              if(h.includes(marker)&&w.includes('if(event.request.mode==="navigate" && !isAppEntry) return;')){
                deployed=true;break;
              }
              await wait(10000);
            }
            must(deployed,'New HTML and document-safe SW have not reached live GitHub Pages');
            const manifest=JSON.parse(readFileSync('pdf-library.json','utf8'));
            const records=Object.values(manifest.by_url||{}).filter(v=>v.local);
            const paths=[...new Set(records.map(v=>v.local))];
            const previews=[...new Set(records.map(v=>v.preview))];
            must(records.length===75&&paths.length===75&&previews.length===75,
              'PDF library mappings no longer contain 75 unique PDFs and previews');
            must(records.every(v=>v.preview&&v.local.endsWith('.pdf')&&v.preview.endsWith('.webp')),
              'Malformed PDF library mapping');

            const localChecks=await allConcurrent(
              [...paths.map(x=>({path:x,kind:'PDF'})),...previews.map(x=>({path:x,kind:'preview'}))],
              async ({path,kind})=>{
                const r=await reachable(new URL(path,BASE).href);
                const correct=kind==='PDF'?/application\/pdf/i.test(r.type||''):/image\/(webp|octet-stream)/i.test(r.type||'');
                return {path,kind,ok:r.ok&&correct,status:r.status,contentType:r.type,error:r.error};
              },8);
            const invalid=localChecks.filter(x=>!x.ok);
            must(invalid.length===0,'Broken localized PDF or preview URL(s): '+JSON.stringify(invalid.slice(0,30)));
            console.log('PASS: all 75 hosted PDFs and 75 first-page previews return correct content types');

            const specimen=records.find(x=>x.bytes<1000000);
            must(specimen,'No sample PDF to inspect');
            const sampleUrl=new URL(specimen.local,BASE).href;
            const response=await fetch(sampleUrl,{headers:{Range:'bytes=0-15'},signal:AbortSignal.timeout(30000)});
            must(response.ok,'Could not fetch sample PDF bytes '+sampleUrl);
            const reader=response.body.getReader();
            const part=await reader.read();
            await reader.cancel().catch(()=>{});
            const header=Buffer.from(part.value||[]).subarray(0,5).toString('ascii');
            must(header==='%PDF-','Localized sample does not contain PDF magic bytes: '+header);
            console.log('PASS: sample PDF is actual PDF binary, not the app homepage');

            for(const [label,viewport] of [
              ['mobile',{width:390,height:844}],['desktop',{width:1440,height:900}]
            ]){
              const context=await browser.newContext({
                viewport,isMobile:label==='mobile',hasTouch:label==='mobile'
              });
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              const resp=await page.goto(BASE+'?pdfBrowserTest='+Date.now()+'#home',
                {waitUntil:'domcontentloaded',timeout:45000});
              must(resp?.ok(),label+': home entry failed');
              await page.waitForFunction(()=>
                document.documentElement.dataset.hstuRefinements930==='ready',
                null,{timeout:20000});
              await page.waitForTimeout(900);
              const manuals=await page.evaluate(()=>
                MANUALS.map(m=>({
                  id:m.id,expected:m.title,source:manualHref(m),
                  local:HSTU_LOCAL_MANUALS[m.id]
                }))
              );
              must(manuals.length===18,label+': manual count changed');
              for(const m of manuals){
                const url=new URL(m.source,BASE);
                must(m.local && url.pathname.endsWith('/HSTU-SI/pdf-reader.html')
                  && url.searchParams.get('file')===m.local
                  && url.searchParams.get('title')===m.expected,
                  label+': incorrect local reader identity '+JSON.stringify(m));
              }
              const cards=page.locator('#manualGrid [data-open-manual]');
              must(await cards.count()===18,label+': not all manual cards present');
              const cardItems=await cards.evaluateAll(nodes=>nodes.map(el=>({
                id:el.dataset.openManual,href:el.href,target:el.target,
                original:el.dataset.originalPdfUrl||''
              })));
              for(const c of cardItems){
                const manual=manuals.find(m=>m.id===c.id);
                must(manual && c.href===new URL(manual.source,BASE).href,
                  label+': wrong PDF identity on '+c.id+': '+c.href);
                must(c.target==='_blank',label+': manual should open in a separate tab '+c.id);
              }
              const dims=await page.evaluate(()=>({
                width:innerWidth,doc:document.documentElement.scrollWidth
              }));
              must(dims.doc<=dims.width+3,label+': horizontal overflow');
              must(errors.length===0,label+': uncaught errors '+errors.join(' | '));
              if(label==='mobile'){
                const swready=await page.evaluate(async()=>{
                  if(!('serviceWorker' in navigator))return false;
                  await navigator.serviceWorker.ready;
                  return true;
                });
                must(swready,'mobile: service worker not installed');
              }
              await page.screenshot({path:'/tmp/hstu-pdf-'+label+'.png'});
              await context.close();
              console.log(label+': 18 card sources, first entry and layout PASS');
            }
            console.log('LIVE PDF DELIVERY AUDIT PASS');
          }finally{await browser.close();}
          JS
          node pdf-delivery.mjs
      - name: Record live audit result for review
        if: always()
        env:
          PDF_RESULT: ${{ steps.pdfcheck.outcome }}
          AUDIT_SHA: ${{ github.sha }}
          AUDIT_RUN_ID: ${{ github.run_id }}
          AUDIT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,pathlib,datetime
          record={
            "source_sha":os.environ.get("AUDIT_SHA"),
            "workflow_run_id":os.environ.get("AUDIT_RUN_ID"),
            "workflow_url":os.environ.get("AUDIT_URL"),
            "status":os.environ.get("PDF_RESULT","unknown"),
            "timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "audit_scope":"Live 75 PDFs, 75 previews, 18 manual links, deployed worker, phone and desktop"
          }
          out=pathlib.Path("docs/pdf-delivery-live-audit-status.json")
          out.parent.mkdir(exist_ok=True,parents=True)
          out.write_text(json.dumps(record,indent=2)+chr(10),encoding="utf-8")
          print(record)
          PY
      - name: Save PDF test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hstu-live-pdf-delivery-screenshots
          path: |
            /tmp/hstu-pdf-mobile.png
            /tmp/hstu-pdf-desktop.png
            docs/pdf-delivery-live-audit-status.json
          if-no-files-found: ignore
