name: Stage verified HSTU Capacity Building PDFs
on:
  push:
    branches:
      - repair/capacity-manual-access-2026-10-13
    paths:
      - .github/workflows/stage-public-capacity-pdfs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize-public-manuals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified PDF transport and rendering tools
        run: pip install --disable-pip-version-check --quiet gdown==5.2.0 pymupdf==1.26.5
      - name: Download and verify only the 14 already-public manuals
        run: |
          python - <<'PY'
          import json, time, hashlib, os
          from pathlib import Path
          import gdown, fitz
          public = {
            "sti-handbook-2026": ("15Ag_YV7T-DOsLUFvDov90_NM-fLmTn3J", 1432942),
            "hiv-clinical-2020": ("1bpsDUxsDYgkVaXrBtuc68CU6yCgA1rdv", 2464085),
            "sti-manual-2020": ("18R3GFXNIYtUDguGPGmVekRMY18sbjx5g", 3481787),
            "tb-2021": ("1Smuz3Bqm09I7udxvlE-osIZKixiCBYxb", 3119945),
            "pmtct-2020": ("1lDjJNU1zdmptgdXuhDYdKzT_kNCsY5Xv", 2219506),
            "paediatric-2021": ("1yt-9Za2EZLeBBWT_h80wjFUZnBJ64fBo", 1351904),
            "prep-implementation-2025": ("1maP4824o5bv75_N7mKHVr7uRkSeJZbAT", 4010198),
            "ci-field-2025": ("1SqBmSquvVqqE6fwPCouiCpjxHVS1hgNQ", 5240855),
            "disclosure-2021": ("1ohTn_SmKE3ZUkDYS9OhOwfLmvSJpkWPp", 853570),
            "linkage-retention": ("1U6kRcpG984hZyz536bz6hzQL1b_cBw6R", 4252510),
            "pitc": ("1EwlhYB-ZCTkJ_luhV9sOo0jeqrvbR9E6", 11178059),
            "dhis2-2026": ("1WM0-K1qkvgO-5Z1n1rCg5eP8T-vGOLNx", 5488116),
            "tsis2-2026": ("1yy7IGq4eiauZ6HoYvUO9fNNuLHJOU5BK", 14916709),
            "nsp-2023-2030": ("14i6aH8agpCZSncBY3RWDKHuPkTu4LXui", 4524064),
          }
          assert len(public) == 14 and "pitc-facilitator" not in public
          html_path=Path('index.html')
          html=html_path.read_text(encoding='utf-8')
          assert html.count('function manualHref(m){return manualSourceUrl(m)||\'#\'}')==1
          marker="const TRAINING=["
          assert html.count(marker)==1
          assert 'const CAPACITY_PDF_LOCAL=' not in html
          manifests=Path('pdf-library.json')
          manifest=json.loads(manifests.read_text(encoding='utf-8'))
          manual_data=html.split('const MANUALS=',1)[1].split(';\nconst TRAINING=',1)[0]
          manuals=json.loads(manual_data)
          by_id={m['id']:m for m in manuals}
          assert all(k in by_id for k in public)
          outputs={}
          for key,(fid,expected) in public.items():
            file=Path(f'documents/pdf-library/capacity-{key}.pdf')
            preview=Path(f'media/pdf-previews/capacity-{key}.webp')
            file.parent.mkdir(parents=True,exist_ok=True)
            preview.parent.mkdir(parents=True,exist_ok=True)
            for attempt in range(1,4):
              try:
                if file.exists(): file.unlink()
                result=gdown.download(id=fid,output=str(file),quiet=True)
                if not result or not file.is_file(): raise RuntimeError('Drive fetch returned no PDF')
                if file.stat().st_size != expected: raise RuntimeError(f'size mismatch {file.stat().st_size} != {expected}')
                with file.open('rb') as f:
                  if f.read(5)!=b'%PDF-': raise RuntimeError('Response is not PDF')
                with fitz.open(file) as pdf:
                  if pdf.page_count < 1: raise RuntimeError('Zero-page PDF')
                  pix=pdf[0].get_pixmap(matrix=fitz.Matrix(1.0,1.0),alpha=False)
                  pix.pil_save(str(preview),format='WEBP',quality=77,method=5)
                if not preview.exists() or preview.stat().st_size<500: raise RuntimeError('Preview missing')
                break
              except Exception as exc:
                print('RETRY',key,attempt,type(exc).__name__,str(exc)[:180])
                if attempt==3: raise
                time.sleep(3*attempt)
            outputs[key]={'source':f'https://drive.google.com/file/d/{fid}/view',
                          'local':str(file),'preview':str(preview),
                          'bytes':expected,'sha256':hashlib.sha256(file.read_bytes()).hexdigest(),
                          'status':'downloaded'}
            print('VERIFIED',key,expected,outputs[key]['sha256'])
          # Publish every manual only after all 14 PDFs pass integrity checks.
          hosted={key:v['local'] for key,v in outputs.items()}
          html=html.replace(marker,'const CAPACITY_PDF_LOCAL='+json.dumps(hosted,separators=(',',':'))+';\n'+marker,1)
          old="function manualHref(m){return manualSourceUrl(m)||'#'}"
          new=("function manualHref(m){const file=CAPACITY_PDF_LOCAL[m?.id];"
               "return file?'pdf-reader.html?file='+encodeURIComponent(file)+"
               "'&title='+encodeURIComponent(m.title):(manualSourceUrl(m)||'#')}")
          assert html.count(old)==1
          html=html.replace(old,new,1)
          # Correct misleading wording without changing CSS, colors or layout.
          html=html.replace("${esc(m.category)} · Bundled PDF", "${esc(m.category)} · ${CAPACITY_PDF_LOCAL[m.id]?'On-site PDF':m.id==='pitc-facilitator'?'Restricted Drive PDF':'External PDF'}",1)
          html=html.replace("arr.length} bundled PDF${arr.length===1?'':'s'} shown", "arr.length} manual${arr.length===1?'':'s'} shown",1)
          assert 'const CAPACITY_PDF_LOCAL=' in html and 'pitc-facilitator' not in hosted
          assert '--red:#d71920;' in html and '--green:#169447;' in html
          assert 'data-view="capacity"' in html
          html_path.write_text(html,encoding='utf-8')
          for key,item in outputs.items():
            m=by_id[key]
            sources={item['source'],f'https://drive.google.com/file/d/{public[key][0]}/preview'}
            if str(m.get('url','')).startswith('https://'):sources.add(m['url'])
            for src in sources:
              manifest['by_url'][src]={k:item[k] for k in ('source','local','preview','bytes','status')}
          manifest['generated']='2026-10-13'
          manifest['stats']['pdf_urls_discovered']=len(manifest['by_url'])
          manifest['stats']['localized']=len({x['local'] for x in manifest['by_url'].values() if x.get('local')})
          manifest['stats']['previews_generated']=len({x['preview'] for x in manifest['by_url'].values() if x.get('preview')})
          manifest['stats']['localized_bytes']+=sum(v['bytes'] for v in outputs.values())
          manifests.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          audit=Path('internal-audits/HSTU_CAPACITY_MANUAL_HOSTING_2026-10-13.json')
          audit.parent.mkdir(parents=True,exist_ok=True)
          audit.write_text(json.dumps({'hosted':outputs,'restricted':{'id':'pitc-facilitator','published':False}},indent=2)+'\n')
          print('VALIDATED_ALL',len(outputs))
          PY
      - name: Verify HSTU page structure and local reader paths
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          s=Path('index.html').read_text()
          data=json.loads(s.split('const CAPACITY_PDF_LOCAL=',1)[1].split(';',1)[0])
          assert len(data)==14
          assert all(Path(path).exists() and Path(path).read_bytes().startswith(b'%PDF-') for path in data.values())
          assert not any('pitc-facilitator'==k for k in data)
          assert "pdf-reader.html?file=" in s
          assert 'hstu-final-refinements-930' in s
          assert 'class="nav-btn"' in s
          assert Path('pdf-reader.html').is_file()
          assert Path('vendor/pdfjs/pdf.min.js').is_file()
          print('All 14 PDFs, all reader paths and original interface markers verified')
          PY
      - name: Commit staged hosting repair on the repair branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pdf-library.json internal-audits/HSTU_CAPACITY_MANUAL_HOSTING_2026-10-13.json
          git add documents/pdf-library/capacity-*.pdf media/pdf-previews/capacity-*.webp
          git diff --cached --stat
          git commit -m "Stage 14 verified public manuals as local HSTU PDFs without changing design"
          test "$(git branch --show-current)" = "repair/capacity-manual-access-2026-10-13"
          git push origin HEAD:repair/capacity-manual-access-2026-10-13
