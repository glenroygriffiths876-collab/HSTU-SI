name: Gia search logic diagnostic
on:
  push:
    paths:
      - '.github/workflows/gia-search-logic.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/gia_search_logic.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal-audits/gia-search-logic.json
          git commit -m "Inspect Gia search implementation" || exit 0
          git pull --rebase origin main
          git push
