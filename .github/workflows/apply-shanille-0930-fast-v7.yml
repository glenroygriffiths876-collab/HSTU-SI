name: Apply Shanille 30 Sep refinements v8
on:
  push:
    paths:
      - '.github/workflows/apply-shanille-0930-fast-v7.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply current refinement patch
        run: python scripts/apply_shanille_0930_v3.py
      - name: Refresh service worker cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("service-worker.js")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r'const CACHE_NAME="[^"]+";', 'const CACHE_NAME="hstu-resource-centre-v20261001-shanille-0930-v5";', s, count=1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Source QA
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          checks=[
            'id="hstu-shanille-0930-v3"',
            'id="hstu-shanille-0930-v3-routing"',
            '15 Thematic Research Areas',
            'Research Agenda Priorities',
            'Studies stored on the Research Repository',
            'Presentations',
            'Posters',
            'External Links',
            'Find Services'
          ]
          for x in checks:
              assert x in s,x
          assert "C-TECH" not in s.upper()
          assert len(list(Path("media/repository").glob("*.webp")))==51
          print("SOURCE QA PASS")
          PY
      - name: Commit production update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Harden thematic routing for Shanille refinements"
          git pull --rebase origin main
          git push origin main
