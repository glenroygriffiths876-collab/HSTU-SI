name: Extract resource contributor candidates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-resource-contributor-candidates.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Extract likely presenter/author lines
        run: |
          find documents/pdf-library -type f -name '*.pdf' -print0 | while IFS= read -r -d '' f; do
            txt=$(pdftotext -f 1 -l 3 -layout "$f" - 2>/dev/null || true)
            hits=$(printf '%s\n' "$txt" | grep -Ein -m 8 'presented by|prepared by|compiled by|developed by|written by|authored by|^.{0,12}by (dr\.|prof\.|mr\.|mrs\.|ms\.|[A-Z][A-Za-z.-]+ [A-Z])' || true)
            if [ -n "$hits" ]; then
              echo "=== $f ==="
              printf '%s\n' "$hits"
            fi
          done
