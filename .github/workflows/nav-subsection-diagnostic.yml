name: Nav subsection diagnostic v2
on:
  push:
    paths:
      - '.github/workflows/nav-subsection-diagnostic.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/nav_subsection_diagnostic.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal-audits/nav-subsection-diagnostic.json
          git commit -m "Inspect dropdown subsection navigation" || exit 0
          git pull --rebase origin main
          git push
