name: Live 9.30 refinements QA
on:
  push:
    paths:
      - '.github/workflows/live-930-refinements-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install chromium
      - name: Verify live desktop and mobile
        run: |
          cat > live-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const URL='https://glenroygriffiths876-collab.github.io/HSTU-SI/';
          const ok=(v,m)=>{if(!v) throw new Error(m);};
          for(const [name,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
            const page=await browser.newPage({viewport});
            await page.goto(URL,{waitUntil:'networkidle'});
            await page.waitForTimeout(1200);
            ok(await page.locator('html').getAttribute('data-hstu-refinements930')==='ready',name+': 9.30 runtime');
            const nav=(await page.locator('.nav-btn[data-view]').allTextContents()).map(x=>x.trim());
            for(const x of ['Home','Research','Capacity Building','Reports','Data Audit and Utilization','Gallery','Resources','Find Services']) ok(nav.includes(x),name+': '+x);
            ok(await page.locator('#home-thematic-areas .hstu-theme-card').count()===15,name+': 15 thematic areas');
            ok(await page.locator('#home-quick-access .hstu-quick-card').count()===7,name+': Quick Access');
            ok(await page.locator('#view-home').getByText(/Explore Research/).count()>=1,name+': Explore Research');
            ok(await page.locator('#view-home').getByText(/Explore Capacity Building/).count()===0,name+': no second hero CTA');
            await page.locator('.nav-btn[data-view="gallery"]').click(); await page.waitForTimeout(200);
            const gf=(await page.locator('#hstuGalleryFilters button').allTextContents()).map(x=>x.trim());
            ok(JSON.stringify(gf)===JSON.stringify(['All','HIV','STI','TB','PrEP']),name+': Gallery filters');
            ok(await page.locator('#hstuGalleryGrid img[src*="media/repository/"]').count()===51,name+': 51 Gallery images');
            await page.locator('.nav-btn[data-view="resources"]').click(); await page.waitForTimeout(200);
            const rd=(await page.locator('.nav-btn[data-view="resources"]').locator('xpath=..').locator('.hstu-nav-dropdown button').allTextContents()).map(x=>x.trim());
            ok(JSON.stringify(rd)===JSON.stringify(['Presentations','Posters','External Links','Learning']),name+': Resources dropdown');
            ok((await page.locator('#resources-learning').innerText()).toLowerCase().includes('c-tech')===false,name+': C-Tech removed');
            await page.locator('.nav-btn[data-view="research"]').click(); await page.waitForTimeout(160);
            ok(await page.getByText('Research Agenda Priorities',{exact:true}).count()>=1,name+': Research Agenda Priorities');
            ok(await page.getByText('Studies stored on the Research Repository',{exact:true}).count()>=1,name+': repository wording');
            await page.locator('.nav-btn[data-view="home"]').click(); await page.waitForTimeout(120);
            await page.locator('#home-thematic-areas .hstu-theme-card').first().click(); await page.waitForTimeout(350);
            ok(await page.locator('#view-research.active').count()===1,name+': thematic navigation');
            if(name==='mobile'){
              ok(await page.locator('.nav-btn[data-view="services"]').isVisible(),name+': Find Services visible');
              const sc=page.locator('.hstu-primary-nav-scroll').first();
              ok(await sc.count()===1,name+': mobile tab slider');
              const overflow=await sc.evaluate(el=>getComputedStyle(el).overflowX);
              ok(overflow==='auto'||overflow==='scroll',name+': horizontal nav enabled');
            }
            await page.screenshot({path:name+'.png',fullPage:true});
            console.log('LIVE',name,'PASS');
            await page.close();
          }
          await browser.close();
          JS
          node live-qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-930-refinements
          path: |
            desktop.png
            mobile.png
