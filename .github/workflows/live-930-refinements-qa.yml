name: Live 9.30 refinements QA
on:
  push:
    paths:
      - '.github/workflows/live-930-refinements-qa.yml'
      - 'index.html'
      - 'service-worker.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify deployed desktop and mobile
        run: |
          cat > live-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const BASE='https://glenroygriffiths876-collab.github.io/HSTU-SI/';
          const ok=(v,m)=>{if(!v) throw new Error(m);};
          const expected={All:51,HIV:21,STI:5,TB:1,PrEP:2};

          async function openFresh(viewport,name){
            let last='';
            for(let attempt=1;attempt<=15;attempt++){
              const context=await browser.newContext({viewport,serviceWorkers:'block'});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push('page:'+e.message));
              page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text());});
              try{
                await page.goto(BASE+'?liveqa='+Date.now()+'#home',{waitUntil:'networkidle',timeout:60000});
                await page.waitForTimeout(1000);
                const marker=await page.locator('html').getAttribute('data-hstu-refinements930');
                const hero=await page.locator('#home-purpose-hero').count()?await page.locator('#home-purpose-hero').innerText():'';
                if(marker==='ready' && hero.includes('volume 2 of Unveiling Hope')){
                  return {page,context,errors};
                }
                last='marker='+marker+' hero='+hero.slice(0,180);
              }catch(e){last=String(e);}
              await context.close();
              if(attempt<15) await new Promise(r=>setTimeout(r,10000));
            }
            throw new Error(name+': latest deployment not visible: '+last);
          }
          async function visibleGalleryCount(page){return page.locator('#hstuGalleryGrid > *:visible').count();}
          async function activate(page,view){await page.evaluate(v=>{if(typeof window.setView==='function') window.setView(v);},view); await page.waitForTimeout(180);}

          async function run(name,viewport){
            const {page,context,errors}=await openFresh(viewport,name);
            const dims=await page.evaluate(()=>({doc:document.documentElement.scrollWidth,body:document.body.scrollWidth,win:innerWidth}));
            ok(dims.doc<=dims.win+3 && dims.body<=dims.win+3,name+': horizontal overflow '+JSON.stringify(dims));

            const hero=page.locator('#home-purpose-hero');
            const ht=await hero.innerText();
            ok(ht.includes('About the Research Data Repository'),name+': title');
            ok(ht.includes('approximately 200 studies'),name+': full About paragraph 3');
            ok(ht.includes('volume 2 of Unveiling Hope'),name+': full About paragraph 4');
            ok(ht.includes('emerging trends'),name+': About ending');
            ok(await page.locator('#home-purpose-summary').count()===0,name+': summary cards still present');
            ok(await page.locator('#repository-purpose').isVisible()===false,name+': legacy About visible');
            ok(await page.locator('#home-thematic-areas .hstu-theme-card').count()===15,name+': themes');
            ok(await page.locator('#home-quick-access').count()===1,name+': Quick Access sections');
            ok(await page.locator('#home-quick-access .hstu-quick-card').count()===7,name+': Quick Access cards');
            ok(await page.locator('#view-home').getByText('Everything important, easier to reach.',{exact:true}).count()===1,name+': Quick Access duplicated');
            const anim=await page.locator('.hstu-animated-title-930').evaluate(el=>getComputedStyle(el).animationName);
            ok(anim&&anim!=='none',name+': title animation');

            if(name==='desktop'){
              const service=await page.locator('.nav-btn[data-view="services"]').boundingBox();
              ok(service && service.x+service.width<=viewport.width+2,name+': Find Services off screen');
              const home=page.locator('.nav-btn[data-view="home"]').first();
              await home.hover();
              const dd=home.locator('xpath=..').locator('.hstu-nav-dropdown');
              ok(await dd.isVisible(),name+': Home dropdown');
              ok(await dd.evaluate(el=>getComputedStyle(el).flexDirection)==='column',name+': Home dropdown horizontal');
              await page.screenshot({path:'desktop-home.png',fullPage:false});
            }else{
              ok(await page.getByText('Swipe tabs →',{exact:true}).count()===0,name+': Swipe tabs visible');
              const toggle=page.locator('#menuToggle');
              const mobileMenu=page.locator('#hstuMobileMenu930');
              ok(await toggle.isVisible(),name+': hamburger missing');
              ok(await page.locator('#mainNav').isVisible()===false,name+': desktop nav visible on mobile');
              ok(await mobileMenu.count()===1,name+': dedicated mobile menu missing');
              ok(await mobileMenu.isVisible()===false,name+': mobile menu starts open');
              ok(await page.locator('#hstuMobileSubnav930').count()===0,name+': detached subnav exists');
              await page.screenshot({path:'mobile-home.png',fullPage:false});
              await toggle.click();
              await page.waitForTimeout(120);
              ok(await mobileMenu.isVisible(),name+': menu did not open');
              ok(await mobileMenu.evaluate(el=>getComputedStyle(el).flexDirection)==='column',name+': menu not vertical');
              const gallery=mobileMenu.locator('.hstu-mobile-parent-930').filter({hasText:/^Gallery$/});
              await gallery.click();
              await page.waitForTimeout(100);
              const gdd=gallery.locator('xpath=..').locator('.hstu-mobile-children-930');
              ok(await gdd.isVisible(),name+': Gallery accordion');
              await page.screenshot({path:'mobile-menu.png',fullPage:false});
              await gdd.locator('button').filter({hasText:/^TB$/}).click();
              await page.waitForTimeout(650);
              ok(await page.locator('#view-gallery.active').count()===1,name+': TB did not open Gallery');
              ok(await visibleGalleryCount(page)===1,name+': TB accordion filter');
              ok(await mobileMenu.isVisible()===false,name+': menu stayed open after selection');

              await activate(page,'services');
              await page.waitForTimeout(180);
              await toggle.click();
              const services=mobileMenu.locator('.hstu-mobile-parent-930').filter({hasText:/^Find Services$/});
              await services.click();
              await page.waitForTimeout(100);
              const sdd=services.locator('xpath=..').locator('.hstu-mobile-children-930');
              ok(await sdd.isVisible(),name+': Find Services accordion');
              const labs=(await sdd.locator('button').allTextContents()).map(x=>x.trim());
              ok(JSON.stringify(labs)===JSON.stringify(['Treatment and PrEP','Health Centres']),name+': services labels');
              await page.screenshot({path:'mobile-services-menu.png',fullPage:false});
              if(await mobileMenu.isVisible()) await toggle.click();
              await page.waitForTimeout(100);
            }

            await activate(page,'gallery');
            const filterLabels=(await page.locator('#hstuGalleryFilters button').allTextContents()).map(x=>x.trim());
            ok(JSON.stringify(filterLabels)===JSON.stringify(['All','HIV','STI','TB','PrEP']),name+': Gallery filters');
            for(const key of ['All','HIV','STI','TB','PrEP']){
              await page.locator('#hstuGalleryFilters button').filter({hasText:new RegExp('^'+key+'$')}).click();
              await page.waitForTimeout(100);
              ok(await visibleGalleryCount(page)===expected[key],name+': Gallery '+key);
            }

            await activate(page,'home');
            for(const idx of [0,6,9,13,14]){
              await page.locator('#home-thematic-areas .hstu-theme-card').nth(idx).click();
              await page.waitForTimeout(350);
              ok(await page.locator('#view-research.active').count()===1,name+': thematic '+(idx+1));
              const selected=await page.locator('#refineResearchObjective').inputValue();
              ok(selected!==''&&!/all/i.test(selected),name+': thematic objective '+(idx+1));
              await activate(page,'home');
            }
            ok(errors.length===0,name+': browser errors '+errors.join(' | '));
            console.log('LIVE',name,'PASS');
            await context.close();
          }

          await run('desktop',{width:1440,height:900});
          await run('mobile',{width:390,height:844});
          await browser.close();
          console.log('LIVE QA PASS');
          JS
          node live-qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-home-mobile-nav
          path: |
            desktop-home.png
            mobile-home.png
            mobile-menu.png
            mobile-services-menu.png
