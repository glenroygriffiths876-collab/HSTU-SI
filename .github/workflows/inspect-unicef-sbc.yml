name: Inspect UNICEF SBC learning record
on:
  push:
    paths:
      - '.github/workflows/inspect-unicef-sbc.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show exact record
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needle="https://agora.unicef.org/course/info.php?id=41002"
          p=s.find(needle)
          print("position",p)
          if p<0: raise SystemExit("UNICEF URL not found")
          print(s[max(0,p-1800):p+2600])
          PY
