name: HSTU PDF Reader Browser Diagnostic (source files)
on:
  push:
    paths:
      - '.github/workflows/hstu-reader-local-browser-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Isolated local browser PDF rendering diagnosis
        run: |
          python3 -m http.server 8765 >/tmp/hstu-browser-http.log 2>&1 &
          sleep 2
          cat > /tmp/hstu-probe.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          (async()=>{
            const b=await chromium.launch();
            const p=await b.newPage();
            const messages=[],failures=[];
            p.on('console',m=>{if(['error','warning'].includes(m.type())) messages.push({type:m.type(),text:m.text()})});
            p.on('pageerror',e=>failures.push(e.message));
            p.on('requestfailed',r=>failures.push(r.url()+': '+r.failure()?.errorText));
            const cases=[
              {title:'SI Report (July 2026)',pages:55,local:'documents/pdf-library/8a054d-089d438912ef4d23a90c6a211e3c9f05-99b13548.pdf'},
              {title:'SI Quarterly Report (March 2026)',pages:61,local:'documents/pdf-library/8a054d-1479a1a62dc646c79c0da8c220455801-d583c09d.pdf'}
            ];
            const results=[];
            for(const item of cases){
              const url='http://127.0.0.1:8765/pdf-reader.html?file='+encodeURIComponent(item.local)+'&title='+encodeURIComponent(item.title);
              await p.goto(url,{waitUntil:'domcontentloaded'});
              const rendered=await p.waitForFunction(()=>document.documentElement.dataset.hstuPdfReady==='1'
                  && document.querySelector('#pageCanvas') && !document.querySelector('#pageCanvas').hidden,
                  null,{timeout:21000}).then(()=>true).catch(()=>false);
              const state=await p.evaluate(()=>({
                active:document.documentElement.dataset.hstuPdfFile,
                title:document.querySelector('#documentTitle')?.textContent,
                ready:document.documentElement.dataset.hstuPdfReady,
                failed:document.documentElement.dataset.hstuPdfError,
                preview:document.querySelector('#cover')?.src,
                canvasVisible:!document.querySelector('#pageCanvas')?.hidden,
                page:document.querySelector('#counter')?.textContent,
                imageFingerprint:(()=>{
                   const c=document.querySelector('#pageCanvas');
                   if(!c||c.hidden)return null;
                   const d=c.toDataURL('image/png');let h=2166136261;
                   for(let i=0;i<d.length;i++)h=Math.imul(h^d.charCodeAt(i),16777619)>>>0;
                   return h;
                })()
              }));
              if(!rendered||state.active!==item.local||state.title!==item.title||
                 state.page!=='Page 1 of '+item.pages||!state.canvasVisible)
                 failures.push('Wrong document or broken rendering: '+JSON.stringify({item,state}));
              results.push({requested:item,state});
            }
            if(results[0].state.imageFingerprint===results[1].state.imageFingerprint)
              failures.push('Two DISTINCT report titles rendered the SAME PDF page');
            const result={result:failures.length?'FAIL':'PASS',results,messages,failures};
            console.log('LOCAL BROWSER TWO-REPORT REGRESSION',JSON.stringify(result));
            fs.mkdirSync('docs',{recursive:true});
            fs.writeFileSync('docs/hstu-local-browser-pdf-diagnostic.json',JSON.stringify(result,null,2)+'\n');
            if(failures.length)process.exitCode=1;
            await b.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node /tmp/hstu-probe.cjs
      - name: Store actual source browser diagnosis
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hstu-local-browser-pdf-diagnostic.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Record browser PDF rendering diagnosis without Pages cache"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
