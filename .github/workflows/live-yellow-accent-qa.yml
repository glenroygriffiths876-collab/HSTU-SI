name: Live yellow accent QA
on:
  push:
    paths:
      - '.github/workflows/live-yellow-accent-qa.yml'
      - 'final-refinements-930.js'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify restored yellow accents and core layout
        run: |
          cat > yellow-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const BASE='https://glenroygriffiths876-collab.github.io/HSTU-SI/';
          const ok=(v,m)=>{if(!v) throw new Error(m);};
          const css=async(page,sel,prop)=>page.locator(sel).first().evaluate((el,p)=>getComputedStyle(el)[p],prop);
          async function openFresh(viewport,name){
            let last='';
            for(let i=0;i<18;i++){
              const context=await browser.newContext({viewport,serviceWorkers:'block'});
              const page=await context.newPage();
              await page.goto(BASE+'?yellowqa='+Date.now()+'#home',{waitUntil:'networkidle',timeout:60000});
              await page.waitForTimeout(1000);
              const style=await page.locator('#hstu-legacy-yellow-930').count();
              if(style===1) return {page,context};
              last='yellow style count='+style;
              await context.close();
              if(i<17) await new Promise(r=>setTimeout(r,10000));
            }
            throw new Error(name+': latest yellow patch not live: '+last);
          }
          async function run(name,viewport){
            const {page,context}=await openFresh(viewport,name);
            const dims=await page.evaluate(()=>({doc:document.documentElement.scrollWidth,body:document.body.scrollWidth,win:innerWidth}));
            ok(dims.doc<=dims.win+3 && dims.body<=dims.win+3,name+': horizontal overflow');

            const top=await css(page,'.topline','backgroundImage');
            ok(top.includes('242, 183, 20'),name+': yellow missing from topline '+top);

            const banner=page.locator('.proposal-banner').first();
            if(await banner.count()){
              const bg=await css(page,'.proposal-banner','backgroundImage');
              ok(bg.includes('246, 186, 22')||bg.includes('255, 217, 90'),name+': proposal yellow missing '+bg);
            }

            const galleryIcon=page.locator('.hst-gallery-cta-icon').first();
            if(await galleryIcon.count()){
              const bg=await css(page,'.hst-gallery-cta-icon','backgroundImage');
              ok(bg.includes('246, 186, 22'),name+': Gallery yellow missing '+bg);
            }

            const arcade=page.locator('.hstu-arcade-play').first();
            if(await arcade.count()){
              const bg=await css(page,'.hstu-arcade-play','backgroundColor');
              ok(bg==='rgb(244, 197, 66)',name+': arcade yellow missing '+bg);
            }

            const hope=page.locator('.hstu-unveiling-hope-930').first();
            if(await hope.count()){
              ok(await hope.isVisible(),name+': Unveiling Hope hidden');
              const copy=hope.locator('.hstu-unveiling-hope-copy-930').first();
              if(await copy.count()){
                const col=await copy.evaluate(el=>getComputedStyle(el).color);
                ok(col!=='rgba(0, 0, 0, 0)',name+': Unveiling Hope text transparent');
              }
            }

            if(name==='mobile'){
              const toggle=page.locator('#menuToggle');
              ok(await toggle.isVisible(),name+': mobile menu toggle missing');
            }else{
              ok(await page.locator('.nav-btn[data-view="services"]').count()===1,name+': Find Services missing');
            }
            console.log('YELLOW QA',name,'PASS');
            await context.close();
          }
          await run('desktop',{width:1440,height:900});
          await run('mobile',{width:390,height:844});
          await browser.close();
          console.log('LIVE YELLOW ACCENT QA PASS');
          JS
          node yellow-qa.mjs
