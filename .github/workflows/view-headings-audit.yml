name: View headings audit
on:
  push:
    paths:
      - '.github/workflows/view-headings-audit.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python scripts/view_headings_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal-audits/view-headings.json
          git commit -m "Audit subsection heading targets" || exit 0
          git pull --rebase origin main
          git push
