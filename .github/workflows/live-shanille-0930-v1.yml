name: Live Shanille 30 Sep QA v7
on:
  push:
    paths:
      - '.github/workflows/live-shanille-0930-v1.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser QA
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test live public repository
        run: |
          mkdir -p live-qa
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          URL="https://glenroygriffiths876-collab.github.io/HSTU-SI/"
          report={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for name,vp in [("desktop",{"width":1440,"height":1000}),("mobile",{"width":390,"height":844})]:
                  page=browser.new_page(viewport=vp)
                  page_errors=[]
                  page.on("pageerror",lambda e: page_errors.append(str(e)))
                  page.goto(URL,wait_until="networkidle",timeout=90000)
                  page.wait_for_timeout(1800)
                  text=lambda sel: page.locator(sel).inner_text().strip()
                  body=page.locator("body").inner_text()
                  # old/inconsistent visible wording requested for removal
                  for bad in ["C-TECH","Campaign Gallery","Training & learning","Explore Capacity Building","Open Manual Library","Essential Manuals and Guidance"]:
                      assert bad.lower() not in body.lower(),f"{name}: stale visible wording {bad}"
                  # Primary navigation / mobile rail
                  if name=="desktop":
                      prim=page.locator('#mainNav .nav-btn').all_inner_texts()
                      assert prim==["Home","Research","Capacity Building","Reports","Data Audit and Utilization","Gallery","Resources","Find Services"],prim
                      assert page.locator('#mainNav .nav-btn[data-view="services"]').is_visible()
                  else:
                      rail=page.locator('#hstuMobileSectionRail')
                      assert rail.is_visible()
                      labels=rail.locator('button').all_inner_texts()
                      assert labels==["Home","Research","Capacity Building","Reports","Data Audit & Utilization","Gallery","Resources","Find Services"],labels
                      assert rail.locator('button[data-view="services"]').count()==1
                  # Home exact requirements
                  if name=="mobile":
                      page.locator('#hstuMobileSectionRail button[data-view="home"]').click()
                  else:
                      page.locator('#mainNav .nav-btn[data-view="home"]').click()
                  page.wait_for_timeout(150)
                  hero=text('#view-home')
                  assert "Explore Research" in hero
                  assert "Explore Capacity Building" not in hero
                  assert page.locator('#home-thematic-areas .hstu-theme-link').count()==15
                  quick=page.locator('#view-home .hstu-final-quick-grid button')
                  assert quick.count()==7
                  qlabels=quick.locator('b').all_inner_texts()
                  assert qlabels==["Research","Capacity Building","Reports","Data Audit & Utilization","Gallery","Resources","Find Services"],qlabels
                  # About highlight language updated
                  facts=page.locator('#repository-purpose .hstu-purpose-facts article').all_inner_texts()
                  assert any("15 Thematic Research Areas" in x for x in facts)
                  assert any("One connected repository" in x for x in facts)
                  # All 15 thematic routes work.
                  for idx in range(15):
                      page.evaluate("window.setView('home')")
                      page.wait_for_timeout(80)
                      page.locator('#home-thematic-areas .hstu-theme-link').nth(idx).click()
                      page.wait_for_timeout(220)
                      assert page.locator('#view-research').is_visible(),f"{name}: thematic route {idx+1}"
                      assert page.locator('#refineResearchObjective').input_value() not in ["","ALL","All","all"],f"{name}: thematic filter {idx+1} did not apply"
                  # Research exact text/filter structure
                  assert "HIV/STI/TB Research" in text('#view-research')
                  assert "Studies stored on the Research Repository" in text('#view-research')
                  assert "Research Agenda Priorities" in text('#view-research')
                  levels=page.locator('#refineResearchLevel option').all_inner_texts()
                  assert levels in [["All Research","Jamaica","Caribbean"],["All levels","Jamaica","Caribbean"],["All","Jamaica","Caribbean"]],levels
                  assert page.locator('#refineResearchObjective option').count()>=16
                  # Each top-level view works
                  for view in ["capacity","reports","data-audit","gallery","resources","services"]:
                      if name=="mobile":
                          b=page.locator(f'#hstuMobileSectionRail button[data-view="{view}"]')
                          b.evaluate("(e)=>e.scrollIntoView({inline:'center',block:'nearest'})")
                          b.click()
                      else:
                          page.locator(f'#mainNav .nav-btn[data-view="{view}"]').click()
                      page.wait_for_timeout(100)
                      assert page.locator(f'#view-{view}').is_visible(),view
                  # Gallery
                  if name=="desktop": page.locator('#mainNav .nav-btn[data-view="gallery"]').click()
                  else:
                      b=page.locator('#hstuMobileSectionRail button[data-view="gallery"]');b.evaluate("(e)=>e.scrollIntoView({inline:'center',block:'nearest'})");b.click()
                  page.wait_for_timeout(150)
                  assert text('#view-gallery h1')=="Gallery"
                  filters=page.locator('#hstuGalleryFilters [data-gallery-filter]').all_inner_texts()
                  assert filters==["All","HIV","STI","TB","PrEP"],filters
                  assert page.locator('#hstuGalleryGrid > *').count()==51,page.locator('#hstuGalleryGrid > *').count()
                  gnav=page.locator('#mainNav .nav-btn[data-view="gallery"]').locator('xpath=..').locator('.hstu-nav-dropdown button').all_inner_texts()
                  assert gnav==["All","HIV","STI","TB","PrEP"],gnav
                  # Resources
                  if name=="desktop": page.locator('#mainNav .nav-btn[data-view="resources"]').click()
                  else:
                      b=page.locator('#hstuMobileSectionRail button[data-view="resources"]');b.evaluate("(e)=>e.scrollIntoView({inline:'center',block:'nearest'})");b.click()
                  page.wait_for_timeout(150)
                  rnav=page.locator('.hstu-resource-section-nav button').all_inner_texts()
                  assert rnav==["Presentations","Posters","External Links","Learning"],rnav
                  for sid in ["resources-presentations","resources-posters","resources-external","resources-learning"]:
                      assert page.locator('#'+sid).count()==1,sid
                  assert "C-TECH" not in text('#view-resources').upper()
                  resource_dd=page.locator('#mainNav .nav-btn[data-view="resources"]').locator('xpath=..').locator('.hstu-nav-dropdown button').all_inner_texts()
                  assert resource_dd==["Presentations","Posters","External Links","Learning"],resource_dd
                  # Learning/external links must be populated; probe destinations.
                  links=page.locator('#resources-learning a, #resources-external a').evaluate_all("(els)=>els.map(e=>({t:e.innerText.trim(),u:e.href}))")
                  assert links,f"{name}: no resource links"
                  assert all(x["u"] and x["u"].startswith(("http://","https://")) for x in links),links
                  link_checks=[]
                  if name=="desktop":
                      seen=set()
                      for x in links:
                          u=x["u"]
                          if u in seen: continue
                          seen.add(u)
                          try:
                              resp=page.request.get(u,timeout=20000,fail_on_status_code=False,max_redirects=10)
                              status=resp.status
                          except Exception as ex:
                              status="request-error"
                          link_checks.append({"title":x["t"],"url":u,"status":status})
                      broken=[x for x in link_checks if isinstance(x["status"],int) and x["status"] in [404,410]]
                      assert not broken,f"broken resource links: {broken}"
                  # Gia launcher must open the panel.
                  assert page.locator('#clinicalLauncher').count()==1
                  page.locator('#clinicalLauncher').click()
                  page.wait_for_timeout(180)
                  assert page.locator('.clinical-panel,.clinical-drawer').filter(has=page.locator('.clinical-head')).count()>=1
                  assert page.locator('.clinical-head').is_visible()
                  page.locator('.clinical-close').click()
                  # No runtime JS errors.
                  assert not page_errors,f"{name}: JS errors {page_errors}"
                  # Find Services guaranteed accessible on phone
                  if name=="mobile":
                      fs=page.locator('#hstuMobileSectionRail button[data-view="services"]')
                      fs.evaluate("(e)=>e.scrollIntoView({inline:'center',block:'nearest'})")
                      fs.click();page.wait_for_timeout(150)
                      assert page.locator('#view-services').is_visible()
                  if name=="mobile":
                      overflow=page.evaluate("document.documentElement.scrollWidth-document.documentElement.clientWidth")
                      assert overflow<=2,f"mobile horizontal page overflow {overflow}px"
                  page.screenshot(path=f"live-qa/{name}.png",full_page=False)
                  report[name]={
                      "primary_views":"PASS",
                      "thematic_areas":15,
                      "quick_access":qlabels,
                      "gallery_filters":filters,
                      "gallery_items":51,
                      "resource_subsections":rnav,
                      "resource_links":[x["u"] for x in links],
                      "link_checks":link_checks if name=="desktop" else [],
                      "gia":"PASS",
                      "find_services":"PASS"
                  }
                  page.close()
              browser.close()
          open("live-qa/results.json","w").write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-shanille-0930-qa-v7
          path: live-qa/
          if-no-files-found: error
