name: Live HSTU design and first-tap guard

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/live-hstu-design-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hstu-live-design-guard
  cancel-in-progress: true

jobs:
  production-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify actual GitHub Pages on desktop and phone
        run: |
          cat > /tmp/hstu-live-design-guard.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://glenroygriffiths876-collab.github.io/HSTU-SI/';
          const requiredMarker='button[data-purpose-view="data-audit"]{background:var(--gold,#f2b714)!important';
          const must=(v,label)=>{if(!v)throw new Error(label);};
          const sleep=t=>new Promise(r=>setTimeout(r,t));
          const browser=await chromium.launch({headless:true});
          try{
            // GitHub Pages deployment is asynchronous after a push.
            let live=false;
            for(let attempt=0;attempt<40;attempt++){
              const response=await fetch(base+'?designVersion='+Date.now(),{
                signal:AbortSignal.timeout(15000),cache:'no-store'
              }).catch(()=>null);
              const html=response?.ok?await response.text():'';
              if(html.includes(requiredMarker) && html.includes('id="hstu-final-refinements-930"')){
                live=true;break;
              }
              await sleep(10000);
            }
            must(live,'Production has not yet published the approved HSTU colour palette');

            for(const [name,viewport] of [
              ['desktop',{width:1440,height:900}],
              ['phone',{width:390,height:844}]
            ]){
              const context=await browser.newContext({
                viewport,serviceWorkers:'block',deviceScaleFactor:1,
                isMobile:name==='phone',hasTouch:name==='phone'
              });
              const page=await context.newPage();
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(e.message));
              const response=await page.goto(base+'?visualQA='+Date.now()+'#home',{
                waitUntil:'domcontentloaded',timeout:45000
              });
              must(response?.ok(),name+': first open failed');
              await page.waitForFunction(()=>
                document.documentElement.dataset.hstuRefinements930==='ready'
                && !!document.querySelector('#view-home.active'),
                {timeout:15000}
              );
              await page.getByText('About the Research Data Repository',{exact:true}).first().waitFor({
                state:'visible',timeout:10000
              });
              const width=await page.evaluate(()=>({
                inner:innerWidth,body:document.body.scrollWidth,
                root:document.documentElement.scrollWidth
              }));
              must(width.root<=width.inner+3 && width.body<=width.inner+3,
                name+': horizontal overflow '+JSON.stringify(width));
              const buttons=page.locator('#home-purpose-hero .hstu-purpose-cta-930 button');
              must(await buttons.count()===3,name+': hero button count changed');
              for(const [route,bg,fg] of [
                ['research','rgb(22, 148, 71)','rgb(255, 255, 255)'],
                ['reports','rgb(215, 25, 32)','rgb(255, 255, 255)'],
                ['data-audit','rgb(242, 183, 20)','rgb(22, 19, 7)']
              ]){
                const el=page.locator('#home-purpose-hero .hstu-purpose-cta-930 button[data-purpose-view="'+route+'"]');
                must(await el.count()===1,name+': '+route+' missing');
                const style=await el.evaluate(el=>{
                  const c=getComputedStyle(el);
                  return {bg:c.backgroundColor,fg:c.color,image:c.backgroundImage};
                });
                must(style.bg===bg && style.fg===fg && style.image==='none',
                  name+': '+route+' changed styles '+JSON.stringify(style));
              }
              const top=await page.locator('.topline').first().evaluate(el=>getComputedStyle(el).backgroundImage);
              must(/242, 183, 20/.test(top),name+': original yellow accent missing');
              await page.screenshot({path:'/tmp/hstu-'+name+'-home.png',fullPage:false});
              for(const route of ['research','reports','data-audit']){
                await page.locator('#home-purpose-hero .hstu-purpose-cta-930 button[data-purpose-view="'+route+'"]').click();
                must(await page.locator('#view-'+route+'.active').count()===1,
                  name+': '+route+' needed more than one tap');
                await page.evaluate(()=>window.setView('home',{push:false}));
              }
              must(await page.locator('#home-thematic-areas .hstu-theme-card').count()===15,
                name+': research thematic areas changed');
              if(name==='phone'){
                const toggle=page.locator('#menuToggle');
                must(await toggle.isVisible(),'phone: hamburger hidden');
                await toggle.click();
                must(await page.locator('#hstuMobileMenu930').isVisible(),
                  'phone: menu did not open');
                await toggle.click();
              }
              must(pageErrors.length===0,name+': uncaught errors: '+pageErrors.join(' | '));
              await context.close();
              console.log(name+' LIVE DESIGN AND FIRST-TAP PASS');
            }
            console.log('LIVE HSTU DESIGN REGRESSION GUARD PASS');
          }finally{await browser.close();}
          JS
          node /tmp/hstu-live-design-guard.mjs
      - name: Save desktop and phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hstu-live-design-guard-screenshots
          path: |
            /tmp/hstu-desktop-home.png
            /tmp/hstu-phone-home.png
          if-no-files-found: ignore
