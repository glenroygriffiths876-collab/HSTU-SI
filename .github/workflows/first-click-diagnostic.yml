name: First click diagnostic
on:
  push:
    paths:
      - '.github/workflows/first-click-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect first-load and click routing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8",errors="ignore")
          clean=re.sub(r'data:(?:image|application)/[^;]+;base64,[A-Za-z0-9+/=]+','[DATA_URI_REMOVED]',s)
          scripts=re.findall(r'<script([^>]*)>(.*?)</script>',clean,re.I|re.S)
          ids=[]
          for attrs,body in scripts:
              m=re.search(r'id=["\']([^"\']+)["\']',attrs,re.I)
              ids.append(m.group(1) if m else '')
          from collections import Counter
          counts=Counter(ids)
          print("\n==== SCRIPT COUNTS ====")
          print("total scripts",len(scripts),"id scripts",sum(1 for x in ids if x),"no-id",sum(1 for x in ids if not x))
          for k,v in sorted(counts.items(),key=lambda kv:(-kv[1],kv[0])):
              if v>1 or k:
                  print(v, k or "<no-id>")
          print("\n==== NO-ID SCRIPT SIGNATURES ====")
          sigs=Counter()
          for (attrs,body),idv in zip(scripts,ids):
              if idv: continue
              sig=re.sub(r'\s+',' ',body.strip())[:160]
              sigs[sig]+=1
          for sig,v in sigs.most_common():
              if v>1: print(v,sig)
          pats=[
            "navigator.serviceWorker","serviceWorker.register","function setView","window.setView",
            "hashchange","location.hash","DOMContentLoaded","addEventListener('load'","addEventListener(\"load\"",
            "preventDefault","stopImmediatePropagation","pointerup","touchstart"
          ]
          for pat in pats:
            print("\n====",pat,"====")
            start=0; hits=0
            while True:
              i=clean.lower().find(pat.lower(),start)
              if i<0 or hits>=6: break
              print(clean[max(0,i-1600):i+4500])
              print("\n---")
              start=i+len(pat); hits+=1
            if hits==0: print("NOT FOUND")
          PY
